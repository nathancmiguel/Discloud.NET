name: Release

# Publishes to NuGet when a version tag such as v1.2.3 or v1.3.0-preview.1 is pushed.
# Requires the NUGET_API_KEY repository (or environment) secret.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  validate:
    name: Build, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version (expected v1.2.3 or v1.2.3-preview.1)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack Discloud/Discloud.csproj -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Verify the package can be consumed
        run: bash eng/verify-package.sh artifacts ${{ steps.version.outputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: validate
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to add a manual approval gate.
    environment: nuget
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts

      - name: Push to NuGet
        # The .snupkg symbols package next to the .nupkg is pushed automatically.
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
